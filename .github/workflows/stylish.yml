name: stylish

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stylish:
    name: "black & flake8 & rpmlint"
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
    - name: Base setup
      run: |
        dnf --setopt install_weak_deps=False install -y \
            git-core \
            python3-flake8 \
            python3-pip \
            rpmlint \
            black

    - uses: actions/checkout@v7

    - name: Run black
      run: |
        black ./src ./test

    - name: Run flake8
      run: |
        flake8

    - name: Run rpmlint
      run: |
        rpmlint subscription-manager.spec
